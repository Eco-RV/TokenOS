# Checks on every PR to dev_main/main (and pushes to them). See docs/FLUJO.md.
name: CI

on:
  pull_request:
    branches: [dev_main, main]
  push:
    branches: [dev_main, main]

jobs:
  app:
    name: App (typecheck + lint + formato + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
